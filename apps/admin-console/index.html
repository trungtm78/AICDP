<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/och-logo.png" />
    <title>OCH — Customer Data Platform</title>
    <!-- Đặt theme TRƯỚC khi render để tránh nháy (OCH mặc định light heritage). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("aicdp-theme");
          document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
