# OCH-CDP demo — deploy self-host một máy (Linux + Docker).
# Chạy tại thư mục deploy/:  docker compose -f docker-compose.prod.yml up -d --build
# Seed dữ liệu demo (một lần):  docker compose -f docker-compose.prod.yml run --rm seed
# Web (admin-console + API proxy) nghe cổng 8070 — domain och-aicdp.aipower.vn trỏ về đây.
name: och-aicdp

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: occ_cdp
      POSTGRES_PASSWORD: occ_cdp_dev
      POSTGRES_DB: AI_CDP_Pro
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occ_cdp -d AI_CDP_Pro"]
      interval: 5s
      timeout: 3s
      retries: 20

  core-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core-api
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: AI_CDP_Pro
      PGUSER: occ_cdp
      PGPASSWORD: occ_cdp_dev
      CORE_API_PORT: "8071"
      CORE_API_JWT_SECRET: "och-aicdp-demo-jwt-secret-2026-do-not-use-in-real-prod"
      CORE_API_DEMO_RESET: "1"  # hiện link đặt lại trên màn (demo, không gửi email thật)
    depends_on:
      postgres:
        condition: service_healthy

  # Seed demo OCH (chạy tay 1 lần sau khi up): TRUNCATE + dữ liệu đầy đủ mọi màn.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core-api
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: AI_CDP_Pro
      PGUSER: occ_cdp
      PGPASSWORD: occ_cdp_dev
    command: ["pnpm", "--dir", "services/core-api", "exec", "tsx", "scripts/seed-demo.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8070:8070"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-dist:/usr/share/nginx/html:ro
    depends_on:
      - core-api

volumes:
  pgdata:
