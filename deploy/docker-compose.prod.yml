# OCH-CDP demo — deploy self-host một máy (Linux + Docker).
# Chạy tại thư mục deploy/:  docker compose -f docker-compose.prod.yml up -d --build
# Seed dữ liệu demo (một lần):  docker compose -f docker-compose.prod.yml run --rm seed
# Web (admin-console + API proxy) nghe cổng 8070 — domain och-aicdp.aipower.vn trỏ về đây.
name: och-aicdp

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: occ_cdp
      POSTGRES_PASSWORD: occ_cdp_dev
      POSTGRES_DB: AI_CDP_Pro
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occ_cdp -d AI_CDP_Pro"]
      interval: 5s
      timeout: 3s
      retries: 20

  core-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core-api
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: AI_CDP_Pro
      PGUSER: occ_cdp
      PGPASSWORD: occ_cdp_dev
      NODE_ENV: "production"                       # kích hoạt fail-fast JWT secret (M2)
      CORE_API_PORT: "8071"
      # JWT secret BẮT BUỘC từ env host (deploy/.env), KHÔNG hardcode. Thiếu → core-api fail-fast.
      CORE_API_JWT_SECRET: "${CORE_API_JWT_SECRET:?CORE_API_JWT_SECRET bắt buộc — đặt trong deploy/.env}"
      CORE_API_DEMO_RESET: "0"                     # prod KHÔNG lộ token reset (demo cấp qua admin /reset-link)
      # Rate-limit (H1) + trust proxy sau nginx (M4) — chống brute-force/credential-stuffing.
      RATE_LIMIT_SOURCE_BURST: "${RATE_LIMIT_SOURCE_BURST:-120}"
      RATE_LIMIT_PUBLIC_BURST: "${RATE_LIMIT_PUBLIC_BURST:-20}"
      RATE_LIMIT_IP_BURST: "${RATE_LIMIT_IP_BURST:-240}"
      TRUST_PROXY: "1"
      LLM_DAILY_CALL_CAP: "${LLM_DAILY_CALL_CAP:-300}"   # hạn mức LLM/principal/ngày (CSO)
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"    # prod đặt mật khẩu admin mạnh (seed đọc)
      AI_SERVICE_URL: "http://ai-service:8072"
      REDIS_URL: "redis://redis:6379"
      # LLM key truyền từ env host lúc `docker compose up` (KHÔNG hardcode secret trong file).
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
    # KHÔNG depends_on ai-service (cứng): core-api sống khi ai-service down (circuit-breaker).

  # Redis — cache Real-time Personalization (Profile/Reco API). core-api fallback PG khi down.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # ai-service (ML). Train một lần qua: docker compose ... exec ai-service python -m ai_service.scripts.train_all
  ai-service:
    build:
      context: ../services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: AI_CDP_Pro
      PG_USER: occ_cdp
      PG_PASSWORD: occ_cdp_dev
      MODELS_DIR: /models
    volumes:
      - mldata:/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8072/v1/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Seed demo OCH (chạy tay 1 lần sau khi up): TRUNCATE + dữ liệu đầy đủ mọi màn.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core-api
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: AI_CDP_Pro
      PGUSER: occ_cdp
      PGPASSWORD: occ_cdp_dev
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
    command: ["pnpm", "--dir", "services/core-api", "exec", "tsx", "scripts/seed-demo.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8070:8070"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-dist:/usr/share/nginx/html:ro
    depends_on:
      - core-api

volumes:
  pgdata:
  mldata:
