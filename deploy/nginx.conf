# OCH-CDP demo — tĩnh admin-console + proxy /v1 -> core-api. Nghe cổng 8070.
# TLS/domain (och-aicdp.aipower.vn) do reverse-proxy phía ngoài đảm nhiệm.

# H1: rate-limit edge cho login/reset (backstop; core-api có rate-limit per-principal/IP).
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=10r/m;

server {
  listen 8070;
  server_name _;

  # Tắt sendfile: tránh bug nghẽn file tĩnh qua virtio trong VM
  sendfile off;

  # M1: resolver Docker DNS → proxy_pass qua BIẾN để re-resolve IP core-api runtime
  # (tránh 502 sau khi recreate core-api đổi IP; nginx không cache IP cũ nữa).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Nén asset (JS 1.7MB -> ~400KB)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  root /usr/share/nginx/html;
  index index.html;

  # H1: siết riêng nhóm auth (login/reset) — chống brute-force ở tầng edge.
  location ~ ^/v1/auth/(login|password-reset) {
    limit_req zone=authlimit burst=10 nodelay;
    set $up core-api;
    proxy_pass http://$up:8071;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # API core-api (giữ nguyên path /v1/...)
  location /v1/ {
    set $up core-api;
    proxy_pass http://$up:8071;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache asset băm tên file
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
