# OCH-CDP demo — tĩnh admin-console + proxy /v1 -> core-api. Nghe cổng 8070.
# TLS/domain (och-aicdp.aipower.vn) do reverse-proxy phía ngoài đảm nhiệm.
server {
  listen 8070;
  server_name _;

  # Tắt sendfile: tránh bug nghẽn file tĩnh qua virtio trong VM
  sendfile off;

  # Nén asset (JS 1.7MB -> ~400KB)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  root /usr/share/nginx/html;
  index index.html;

  # API core-api (giữ nguyên path /v1/...)
  location /v1/ {
    proxy_pass http://core-api:8071;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache asset băm tên file
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
