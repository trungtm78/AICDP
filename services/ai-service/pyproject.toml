[project]
name = "occ-cdp-ai-service"
version = "0.1.0"
description = "OCH-CDP ai-service — ML thật (churn/CLV/propensity/next-purchase/lookalike) serve qua FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lifetimes>=0.11.3",
    "joblib>=1.4",
    "cloudpickle>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
