# Hạ tầng local cho dev. PostgreSQL 18 chạy native trên host (127.0.0.1:5433),
# KHÔNG nằm trong compose này. Compose chỉ lo ClickHouse, Redis, MinIO.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: occ-cdp-clickhouse
    ports:
      - "8123:8123" # HTTP
      - "9001:9000" # native (tránh đụng MinIO 9000)
    environment:
      CLICKHOUSE_DB: occ_cdp
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      # Named volume (KHÔNG bind-mount): bind-mount trên Windows thiếu quyền rename atomic mà
      # ClickHouse cần khi merge/insert parts -> lỗi "filesystem error: in rename: Permission denied".
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: occ-cdp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ai-service (ML: churn/CLV/propensity/next-purchase). Đọc Postgres native trên host.
  # core-api gọi qua AI_SERVICE_URL; down/timeout -> tự fallback heuristic (circuit-breaker).
  ai-service:
    build:
      context: ../services/ai-service
      dockerfile: Dockerfile
    container_name: occ-cdp-ai-service
    ports:
      - "8072:8072"
    environment:
      PG_HOST: host.docker.internal
      PG_PORT: "5433"
      PG_DB: AI_CDP_Pro
      PG_USER: occ_cdp
      PG_PASSWORD: occ_cdp_dev
      MODELS_DIR: /models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8072/v1/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: occ-cdp-minio
    ports:
      - "9000:9000" # S3 API
      - "9090:9090" # console
    environment:
      MINIO_ROOT_USER: occ_cdp
      MINIO_ROOT_PASSWORD: occ_cdp_dev_secret
    command: ["server", "/data", "--console-address", ":9090"]
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
  ai_models:
